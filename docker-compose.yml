services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: sox
      POSTGRES_PASSWORD: sox
      POSTGRES_DB: sox_sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sox -d sox_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
